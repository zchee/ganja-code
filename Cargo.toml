[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/zchee/ganja-code"

# Every dependency the port is expected to need through P6 is declared here so
# that member crates only ever opt in, never choose a version.
[workspace.dependencies]
# A remote engine's consumer: the typed client for `ganja serve`'s REST + SSE
# surface, which is what `run --attach` drives instead of an in-process
# engine. Its own crate so the compiler can hold the promise that matters —
# a client never links the engine — and CI asserts its internal dependency
# list is exactly the protocol.
ganja-client = { path = "crates/ganja-client" }
# The engine both frontends drive: sessions, providers, and the loop that
# executes what the crates below it define.
ganja-core = { path = "crates/ganja-core" }
# Which calls are gated, and which worktree a session is in. Its own crate
# because the answer must not depend on the engine that asks: a tool decides
# containment against a project root, and the engine decides a dialog, from the
# same rules.
ganja-permission = { path = "crates/ganja-permission" }
# The types every side of the app speaks. Depended on by all of them and
# depending on none of them, which is what keeps a frontend — including one
# that later arrives over a socket — from having to build an engine to name an
# event.
ganja-protocol = { path = "crates/ganja-protocol" }
# Talking to a model vendor: the wires, the credentials they present, and the
# catalog that sizes and prices what they serve. Its own crate for the same
# reason `ganja-tool` is — a wire answers to a vendor's HTTP, never to the loop
# that called it, and with the engine outside its dependency graph that is the
# compiler's rule rather than a convention. Auth and the catalog fold in here
# rather than standing alone because the traffic between the three is heavy in
# one direction and a single function in the other.
ganja-provider = { path = "crates/ganja-provider" }
# The engine over a socket: HTTP routes and the SSE event stream. Its own
# crate rather than a module in `ganja-core`, so that a build which only wants
# the terminal never pulls an HTTP server — the same reasoning, one level up,
# that keeps ratatui out of the engine, and CI asserts it the same inverted
# way.
ganja-serve = { path = "crates/ganja-serve" }
# Claude Code's teams directory — the member records and the file-backed
# mailboxes a teammate is addressed through. Its own crate because the
# documents are *somebody else's format*, read and written by a real `claude`
# process sharing the same directory (D-1): the passthrough shapes that keeps
# unknown keys alive belong nowhere near `ganja-protocol`, whose whole posture
# is to refuse a field it does not know. Its internal dependency list is
# exactly the protocol, and CI asserts it.
ganja-team = { path = "crates/ganja-team" }
# Dev-only: the scripted-provider/recorder-tool/storage-seeding scaffolding
# `ganja-core`'s own `tests/*.rs` binaries pulled in as a path dev-dependency,
# so the duplication across those files has one place to live instead of
# eleven.
ganja-testkit = { path = "crates/ganja-testkit" }
# What the model can do besides talk, plus the watcher that tells the read log
# a file moved. Split out so that the one-way street is the compiler's rule
# rather than a convention: a tool cannot reach back into the engine, because
# the engine is not in its dependency graph.
ganja-tool = { path = "crates/ganja-tool" }
# Every pixel and no engine logic; the binary links it to draw what the engine
# streams.
ganja-tui = { path = "crates/ganja-tui" }
# There is deliberately no `tmux` workspace dependency: that entry would be
# the opt-in handle another crate uses to consume it, which the sealed-leaf
# P26 user directive (2026-08-18) forbids; `.github/workflows/ci.yaml`'s
# `lint` job asserts both directions.

anyhow = "1.0.104"
# Clipboard read and write through each platform's native surface.
# `image-data` decodes a clipboard image to raw RGBA pixels: the protocol has
# carried binary attachments since P8, so a paste that finds no text can now
# ask for a picture instead of answering the same notice an empty clipboard
# gets (F3, lifting D111's image half). `arboard` does not itself encode PNG —
# see `png` below for that half.
arboard = { version = "3.6.1", default-features = false, features = [
    "image-data",
    # Wayland sessions have no X11 selection to fall back on; this opts the
    # Linux build into speaking wl-clipboard directly.
    "wayland-data-control",
] }
# `async fn` on the nine traits that are dispatched as trait objects — `Tool`,
# `Provider`, `TeammateBackend`, `Subagents`, the shim `Driver`, `Jobs`,
# `Postbox`, `Asker`, `SpawnAsker` — every one held as an `Arc<dyn …>` (or
# passed as `&dyn …`) because which implementation runs is decided at runtime
# by config and environment, the way a provider or a teammate backend is. Native
# `async fn` in traits is not dyn-compatible, and the macro's boxed `Send`
# future is what a vtable can carry. Not a stopgap for a language feature that
# is nearly there: on the 2026-08-23 nightly, `async_fn_in_dyn_trait` still
# refuses `dyn` for an `async fn` in every spelling and is labelled incomplete,
# and return-type notation on `dyn` types (what a `Send` bound would need) is
# unimplemented — re-evaluate when rust-lang/rust#133119 and #109417 close.
async-trait = "0.1.92"
# The HTTP server the serve layer stands on. Chosen over a hand-rolled hyper
# service because upstream's surface is a routed REST-plus-SSE app, and axum's
# extractors are the idiomatic Rust for exactly that shape; it rides the tokio
# and tower stacks already in the tree.
axum = "0.8.9"
# The mailbox lock's retry schedule, and only that. Claude holds the inbox
# through npm proper-lockfile with `{retries: 10, minTimeout: 5, maxTimeout:
# 100}` — npm `retry`'s factor-2, no-jitter ladder of 5, 10, 20, 40, 80 and
# then 100 ms — which is `ExponentialBuilder`'s defaults with three numbers
# changed rather than a schedule to hand-roll beside a hand-rolled `mkdir`
# protocol. `std-blocking-sleep` is what makes it `BlockingRetryable`:
# `ganja-team` is synchronous on purpose, and the engine wraps its waits in
# `spawn_blocking` instead of dragging an async runtime under the file I/O.
backon = { version = "1.6.0", default-features = false, features = [
    "std",
    "std-blocking-sleep",
] }
# base64url, unpadded, in both directions: a PKCE challenge is the encoding of
# a SHA-256, and the account id a ChatGPT login stores comes out of an
# id_token's payload. Padding is a setting on the engine rather than a second
# encoder, which is why one crate covers both.
#
# `simd-unsafe` is one of this crate's own defaults; it is named here so that a
# later `default-features = false` cannot drop the vectorised codec silently.
base64 = { version = "0.23.1", features = ["simd-unsafe"] }
clap = { version = "4.6.6", features = ["derive"] }
# `ratatui` re-exports this exact crate; depending on it here is what turns on
# `event-stream`, which the re-export alone cannot request.
crossterm = { version = "0.29.0", features = ["event-stream"] }
etcetera = "0.11.0"
futures = "0.3.34"
# An OAuth login's unguessable values — the PKCE verifier, and the `state` and
# `nonce` that make a callback answerable only by the request that opened it.
# Each is raw bytes rendered as base64url, so the operating system's entropy is
# the whole requirement: a userspace generator would be state to seed, reseed
# and reason about for thirty-two bytes drawn once per login.
getrandom = "0.4.3"
# The `Matcher` trait `grep-regex`'s `RegexMatcher` implements — already in
# the dependency graph transitively through `grep-regex`/`grep-searcher`,
# named directly here because `bash_output`'s line filter matches against an
# in-memory chunk of output rather than a file `grep-searcher` would walk, so
# it needs the matcher's `is_match` alone and none of the searcher's Sink
# machinery.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# webfetch's markdown format is a real HTML→markdown conversion (upstream
# uses turndown); before this the markdown answer was tag-stripped text.
htmd = "0.5.5"
# `Retry-After` can be an IMF-fixdate; the exact-purpose parser for it,
# zero-dependency and already in the lock through hyper. The one form it may
# not share with the hand parser it replaces — a leap-second `:60` — is
# pinned before the swap and the hand parser survives as a fallback if
# httpdate refuses it.
httpdate = "1.0.3"
ignore = "0.4.33"
# An insertion-ordered map behind `#[serde(flatten)]`, so a key ganja does not
# know about survives a rewrite of a Claude document *in the position it
# arrived in*. `serde_json::Map` cannot: without `preserve_order` it is a
# `BTreeMap`, so an unknown key comes back alphabetized — and turning that
# feature on is worse, because feature unification would reorder every
# `Map` in the workspace. Already resolved in `Cargo.lock` (h2 → hyper →
# reqwest/axum, process-wrap → rmcp), so the `serde` feature is the only thing
# this line actually adds.
indexmap = { version = "2.14.0", features = ["serde"] }
# The one date/time vocabulary, retiring the six-plus hand-rolled
# civil-calendar copies whose docs each cited "the workspace carries no date
# crate" — one of them through an `unsafe localtime_r`. Chosen over the
# in-lock time/chrono by owner decision (2026-08-18): Temporal-shaped API and
# real system-tz support (unix reads /usr/share/zoneinfo), which is what
# retires the CLI's silent UTC degradation. Pre-1.0 accepted deliberately;
# each adopting crate's jiff surface is enumerated in its commit so a future
# major is a grep-sized migration.
jiff = "0.2.35"
# The JSONC dialect ganja's own config has left, kept for the two readers that
# still meet a file written in it: `config::legacy`, which is how `ganja config
# migrate` reads what it converts, and `import.rs`, which reads upstream
# opencode's files — those are somebody else's format and are not migrating
# anywhere. It parses the dialect into a value `serde` can then decode
# strictly, and hands back an AST that still holds the order the document was
# written in, which is what a translation of `permission` rules needs.
# Nothing writes this dialect any more, and the `cst` feature left with the
# last writer — `mcp add` edits TOML through toml_edit now.
jsonc-parser = "0.33.1"
# Compiles and validates the in-repo config schema against Draft 2020-12, both
# in the drift test (crates/ganja-core/tests/config_schema.rs) and nowhere
# else — dev-only. Default features add a `reqwest`-backed resolver for
# `$ref`s that live over HTTP or on disk; the schema has neither, only local
# `#/$defs/...` refs, so they are off and nothing here gains a network
# dependency.
jsonschema = { version = "0.49.9", default-features = false }
# `killpg`, so cancelling a shell command takes its whole process group with
# it without shelling out to `kill(1)`.
libc = "0.2.189"
# The LSP wire types the diagnostics client speaks to rust-analyzer and
# gopls, so requests and notifications are typed instead of hand-built JSON.
lsp-types = "0.97.0"
# The DOM beneath htmd, surfaced for webfetch's text mode: htmd itself
# markdown-escapes every text node with no way to turn it off, which would
# write backslashes into filenames the model then reads as real — so the
# text path walks html5ever's own tree instead, through the rcdom types htmd
# re-exports only partially. Already in the lock beneath htmd; declaring it
# adds no vendor, only the right to name `NodeData`.
markup5ever_rcdom = "0.38.0"
# The command palette and @-file mention rank candidates in-process with the
# same matcher helix uses, instead of hand-rolling a scorer.
nucleo-matcher = "0.3.1"
# Filesystem events behind the stale-read watcher: a file read this session
# and then changed outside it is flagged before the next turn trusts it.
notify = "8.2.0"
# RFC 3986 percent-coding, already in the tree under `url`: the hand decoder
# it replaces read high bytes as Latin-1 (`%E2%9C%93` decoded to mojibake),
# and the hand encoder was one drift away from the same class. The one
# survivor — serve's form-urlencoded reader — is a different dialect
# (`+` means space there) and keeps its own code.
percent-encoding = "2.3.2"
# Encodes a clipboard-pasted image to PNG bytes before it enters the mention
# pipeline as a `File` part (F3). Small and pure-Rust: `arboard`'s own
# `image-data` feature above already pulls in the `image` crate for its own
# platform pixel-format conversions, but that dependency is not part of
# `arboard`'s public surface — `ImageData` hands back raw RGBA only — so
# encoding still needs a crate of its own, and this one is the encoder alone
# rather than the whole `image` stack a second time.
png = "0.18.1"
# Markdown parsed into block events the chat renderer styles; the default
# `html` renderer and the example binary's `getopts` stay off — parsing is
# the only piece the TUI consumes.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The cursor wire's protobuf runtime: Anthropic's pure-Rust, Apache-2.0
# protobuf implementation. Codegen-only (it ships no `#[derive(Message)]` on
# purpose — the `.proto` stays the source of truth), so ganja's own `.proto`
# is generated with `buf generate` against the published remote plugin and
# the result is checked in beside it, with a drift test — no `build.rs` on the
# workspace's hottest crate, and nothing added to any CI lane. Admitted under
# the cursor engagement's R-DEP ruling; the transport half is chosen after the
# live spike names the dialect, not here.
buffa = "0.9.1"
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.2", features = [
    # The widget's own match-highlight machinery, ridden by the composer to
    # reverse the `[Image #N]` token under the cursor (2026-08-15) — one
    # regex over the buffer beats a hand-rolled span overlay.
    "search",
] }
# Decodes the four attachment image formats — png, jpeg, gif (first frame),
# webp — for the composer's kitty-graphics preview, bounded to a thumbnail
# before the pixels ride the wire as PNG. Already in the tree through
# `arboard`'s image-data feature; naming it directly makes the decoders a
# contract rather than a transitive accident. Default features stay off: four
# decoders, none of the rest of the format zoo.
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# A hook's `matcher` is one regex asked one question about one string — does
# this tool name match — and neither matcher already in the tree answers it.
# `grep-regex` builds a line-oriented `Matcher` for `grep-searcher`'s Sink, a
# shape that only makes sense over a stream of lines; `nucleo-matcher` is a
# fuzzy scorer, and a hook that fires on an approximate name would be a hook
# that fires on the wrong call. Already resolved in the lock file through
# `ignore`/`grep-regex`, so naming it here adds a direct edge and no build.
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls",
    "stream",
    "system-proxy",
] }
# The official MCP SDK: config-named servers over stdio and streamable HTTP.
# Client-side only — the default `server` feature stays off, because nothing
# in this workspace serves MCP: the test fixture is a bun server on the
# reference SDK, which is the point of it.
rmcp = { version = "3.1.3", default-features = false, features = [
    "client",
    # Spawns and speaks to a config-named local server as a child process.
    "transport-child-process",
    # The remote transport, over the same reqwest/rustls stack the providers
    # already use.
    "transport-streamable-http-client-reqwest",
] }
# Session storage is SQLite, the way upstream's is. `bundled` compiles the
# exact SQLite this workspace was validated against instead of linking
# whatever the platform ships: the pragma *defaults* the storage layer relies
# on (`foreign_keys`, WAL synchronous level) are build-time properties that
# differ between system libraries, so pinning the library is what pins the
# semantics.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Safe openat/mkdirat wrappers for the anchored file IO in `ganja-tool`'s
# `anchor.rs` — already in the lock beneath tempfile. Staged here with the
# rest of the sweep's pins, but the anchor swap proceeds only behind its own
# verification gate: rustix must pass O_NOFOLLOW|O_DIRECTORY|O_CLOEXEC
# through unmodified, checked in the vendored source before any code moves,
# and this declaration is inert if that gate fails.
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1.2.2"
# Key material is held in `SecretString` so that it is wiped on drop and cannot
# reach a `Debug` rendering; `serde` is what lets `auth.json` decode into one.
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# PKCE's S256 method is literally SHA-256 of the verifier, and the provider
# checks it — a login is refused if the digest disagrees. The digest rustls
# already carries reaches this workspace only transitively, and depending on
# what a TLS stack happens to re-export is not a dependency decision.
#
# 0.11 rather than 0.10 for the backend, not the version number: 0.11 detects
# the CPU's SHA extensions at run time and uses them on both x86 and aarch64,
# falling back to software when they are absent. 0.10 does that on x86 only —
# reaching the same instructions on aarch64 there needs its `asm` feature,
# which pulls a separate crate last released in 2024, builds hand-written
# assembly through a C toolchain, and is then never called on that
# architecture because 0.10's aarch64 path uses intrinsics of its own.
# `default-features = false` drops `alloc` and `oid`: a fixed-size digest over
# a 43-byte string needs neither.
sha2 = { version = "0.11.0", default-features = false }
# One shell word at a time, for the launch line a pane teammate is typed in
# with: bare when every byte is safe, quoted when one is not. Chosen over the
# hand-rolled `'\''` idiom because the idle shell reading that line is the
# person's own and may be fish, which reads a backslash inside single quotes
# as an escape where sh reads it literally — shlex keeps backslashes out of
# single-quoted chunks for exactly that reason — and because a NUL byte is
# refused at compose time instead of riding on to a confusing spawn failure.
# The `bytes` module quotes an `OsStr`'s own bytes, so a non-UTF-8 path
# quotes as itself. Already in the lock as `cc`'s build dependency. Caret on
# purpose: `QuoteError` is `#[non_exhaustive]` and shlex reserves the right
# to refuse new fundamentally-unquotable inputs by default, so an update may
# widen the refusal set — an observable refusal, which is the failure mode
# this tree prefers to a line a shell misreads.
shlex = "2.0.1"
similar = "3.2.0"
# Fenced-code highlighting for the markdown renderer. The regex backend is
# the pure-Rust `fancy-regex` — `default-onig` would put a C library in
# every build — and the bundled syntax set is the language table.
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
# The config file's own dialect, replacing JSONC. Order is semantic here —
# permission rules evaluate last-match-wins, so a reader that handed the loader
# a sorted map would change which rule decides. The straight-to-struct path
# does not need `preserve_order` for that: its deserializer walks the parsed
# document, so a Visitor sees keys where the file spelled them, interleaved
# table headers included (`config_tests.rs` pins it rather than trusting it).
# The feature is on for the other route — `toml::Table`/`Value` is a `BTreeMap`
# without it, and anything reaching for one would re-sort exactly the order
# that pin exists to protect.
toml = { version = "1.1.4", features = ["preserve_order"] }
# The same project's format-preserving half, and the reason `ganja mcp add`
# keeps its contract (D483): editing one `[mcp.<name>]` entry of a file
# somebody hand-commented has to put the entry back without printing the
# comments away, which is this crate's whole job. `serde` is on because the
# writers spell an entry out of the same serde type the loader reads back,
# through `toml_edit::ser`, rather than composing table syntax by hand.
toml_edit = { version = "0.25.13", features = ["serde"] }
# The service trait axum is built on. Admitted alongside it so the serve layer
# can write one middleware (auth, header posture) without a second admission
# round.
tower = "0.5.3"
# Tower's HTTP-specific middleware, admitted with the pair above; a member
# opts in only where a hand-written layer would otherwise duplicate it.
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Already in the tree via `reqwest`, which re-exports only `Url`; the provider
# endpoint check needs `Host` to compare a host as a host rather than as text.
url = "2.5.8"
# Grapheme clusters for the TUI's width-aware splitter: a hard wrap must not
# land inside a ZWJ emoji or a combining sequence, which char-granular
# splitting did. Already in the lock beneath ratatui's own widgets.
unicode-segmentation = "1.13.3"
# Already in the tree via `ratatui-core`; declared here because the chat
# viewport measures its own wrap widths instead of leaning on `Paragraph`.
unicode-width = "0.2.2"
# Every id the protocol mints, and the one dependency `ganja-protocol` grew
# past the two serde crates: RFC 9562 UUIDv7, whose `ContextV7` counter is what
# keeps ids minted inside one millisecond ordered — plain v7's random bits are
# not, and a streaming turn mints many part ids per millisecond (D493). `std`
# is what puts that context behind the crate's own mutex; with defaults off,
# the other six UUID versions and their generators stay out. No `serde`
# feature: ids stay `String` newtypes, so nothing here serializes a `Uuid`.
uuid = { version = "1.24.1", default-features = false, features = ["v7", "std"] }
# PATH resolution with access(2) semantics: the hand walk answered "somebody
# could run this" (`mode & 0o111`) where a spawn needs "this process can run
# it", so a binary exec-only for another owner died at spawn with EACCES
# instead of the documented refusal sentence. Unix dependency list is libc
# alone.
which = "8.0.5"
# Owner-only DACLs on the two secret-bearing surfaces whose unix modes are
# already enforced — the credential store and spilled tool output: create
# handles sealed via `SetSecurityInfo` before the first secret byte, the
# spill directory born private. MIT OR Apache-2.0, and already in the tree
# transitively at three versions; this pins the newest. The feature list is
# the set the windows lint lane compiled while it existed — `LocalFree`'s
# module has moved across windows-sys versions — and since that lane left
# with the rest of the parked windows support (2026-08-12), nothing verifies
# this list until a windows lane returns.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

assert_cmd = "2.2.2"
expectrl = "0.9.0"
insta = "1.48.0"
predicates = "3.1.4"
similar-asserts = "2.0.0"
# Left this group in P25 without moving: `ganja-team`, `ganja-core`,
# `ganja-cli`, `ganja-tui`, and the dev-only `ganja-testkit` name it under
# `[dependencies]`; `ganja-permission`, `ganja-provider`, `ganja-serve`, and
# `ganja-tool` take it only as a dev-dependency.
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false

# What `dist build` compiles. Nothing differs from release on purpose: the
# archive a dist build produces must be the binary a release build was
# validated as, and any deliberate difference belongs here where it is
# visible rather than inside a generated config.
[profile.dist]
inherits = "release"
