[package]
name = "ganja-teammate-cloud"
description = "Cloud-hosted teammate lifecycle and vendor-neutral provisioner contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal workspace component, never published independently.
publish = false

[dependencies]
# Provisioners are selected at runtime and held as trait objects.
async-trait.workspace = true
# The reconnect admission hook returns the client's boxed future type.
futures.workspace = true
ganja-client.workspace = true
ganja-core.workspace = true
ganja-protocol.workspace = true
ganja-team.workspace = true
# Endpoints carry validated header names and values, not vendor-specific fields.
http.workspace = true
# Passwords cannot enter derived Debug output and are wiped on drop.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Cancellation belongs to the registry's lifetime, not a single model turn.
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Terminal reconciliation tests drive the real persisted HTTP projections.
ganja-serve.workspace = true
# The fake implements this contract; the reverse edge is confined to tests.
ganja-testkit.workspace = true
tempfile.workspace = true
