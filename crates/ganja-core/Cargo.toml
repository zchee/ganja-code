[package]
name = "ganja-core"
description = "Engine core for ganja: sessions, providers, tools, and the command/event protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io. Also load-bearing for deny.toml: with every
# member unpublished, `allow-wildcard-paths` exempts the workspace's own path
# dependencies from `wildcards = "deny"`.
publish = false

[dependencies]
# Only where dyn-safety demands it: `Provider` and `Tool` live behind
# `Arc<dyn _>`.
async-trait.workspace = true
# Tool argument schemas, generated from the argument structs themselves so the
# schema a model sees cannot drift from what the tool parses.
schemars.workspace = true
# Resolves `auth.json` under the XDG data directory on every platform, macOS
# included, which is where upstream keeps its own credentials there.
etcetera.workspace = true
futures.workspace = true
# `webfetch`'s markdown format is a real conversion of the page's markup, the
# way upstream's turndown call is, rather than the tag-stripped text that stood
# in for one until the crate landed.
htmd.workspace = true
# `glob` and `grep` walk the filesystem in-process rather than shelling to
# `rg`, sharing the same crates ripgrep itself is built on for byte-identical
# glob and ignore-file semantics.
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
# Config files are JSONC, the way upstream's are. Only the `serde` feature is
# on: it makes the parser itself a `serde::Deserializer` over the token stream,
# so a config decodes straight into its typed struct and sees keys in document
# order. Going through a `serde_json::Value` instead would sort them, and the
# order permission rules were written in is what decides which one wins.
jsonc-parser = { workspace = true, features = ["serde"] }
# The LSP client's payloads are LSP's own types — diagnostics, positions,
# sync kinds — decoded straight off the wire rather than re-declared here
# and drifting from the protocol at the next revision of it.
lsp-types.workspace = true
# The stale-read watcher subscribes to the platform's own filesystem
# notifications — FSEvents, inotify, ReadDirectoryChangesW — instead of polling
# the files a session has read, which on a large checkout would be a stat storm
# for an answer that is almost always "nothing moved".
notify.workspace = true
# The HTTP providers speak SSE, so only `stream` and `json` are load-bearing;
# the workspace declaration pins rustls so no build here reaches for OpenSSL.
reqwest.workspace = true
# Config-named MCP servers are spoken to through the official SDK rather than
# a second hand-rolled JSON-RPC client: the workspace declaration carries the
# stdio and streamable-HTTP transports this module connects over.
rmcp.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# `edit` reports what it changed as a unified patch, which a frontend renders
# instead of the two whole files.
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
# `Host`, for deciding whether an endpoint is loopback without matching strings.
url.workspace = true
# `CancellationToken` lives behind `rt`; the workspace declaration carries no
# features so crates opt into exactly the modules they use.
tokio-util = { workspace = true, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
# The shell tool runs commands in their own process group and `killpg` is the
# call that ends one; Windows support arrives with its own mechanism later.
libc.workspace = true

[dev-dependencies]
# The credential tests write real files, with real permission bits, in a
# directory that goes away afterwards.
tempfile.workspace = true
# `net` is for the provider tests only: they serve canned HTTP over a loopback
# socket rather than mocking the client, so the request really is built, sent,
# retried and streamed. The library itself needs no listener. `test-util` is
# for the LSP wait contract: its whole behavior is a freshness window and a
# 150ms debounce that restarts, and a test that drives the runtime's clock
# proves those in microseconds where one that slept would spend seconds and
# still be a race.
tokio = { workspace = true, features = ["net", "test-util"] }
# Only to prove that a failed request logs nothing resembling an API key: the
# secret-hygiene test needs a subscriber it can read back.
tracing-subscriber.workspace = true
