[package]
name = "ganja-core"
description = "Engine core for ganja: sessions, providers, tools, and the command/event protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io. Also load-bearing for deny.toml: with every
# member unpublished, `allow-wildcard-paths` exempts the workspace's own path
# dependencies from `wildcards = "deny"`.
publish = false

[dependencies]
# Only where dyn-safety demands it: `Tool` and the subagent seam live behind
# `Arc<dyn _>`.
async-trait.workspace = true
# The `Authorization` header an MCP server's config declares, when it declares
# one as a bearer token to be built rather than a literal.
base64.workspace = true
# The two schemas the engine builds rather than derives: an MCP tool's, handed
# over by the server, and the no-argument one the title request advertises.
# Generating a builtin tool's schema is `ganja-tool`'s business.
schemars.workspace = true
# Resolves the config home and the instruction files under it on every
# platform, macOS included, which is where upstream keeps its own there.
etcetera.workspace = true
futures.workspace = true
# Which calls are gated, and which worktree a session is in. Re-exported as
# `ganja_core::permission` and `ganja_core::project`, the module names every
# caller already writes.
ganja-permission.workspace = true
# The types a frontend speaks, re-exported as `ganja_core::protocol`.
ganja-protocol.workspace = true
# The wires, the credential store and the model catalog, re-exported as
# `ganja_core::auth`, `ganja_core::catalog` and — over the half of selection
# that reads a `Config` — `ganja_core::provider`. One way only: a wire has no
# idea a session exists.
ganja-provider.workspace = true
# Where sessions live between runs and the working-tree snapshots `/undo`
# walks, re-exported as `ganja_core::storage` and `ganja_core::snapshot`
# (**D540**) — neither module ever needed the loop that calls it, only a
# project's worktree and the wire types a stored record decodes to.
ganja-storage.workspace = true
# Claude Code's teams directory: the member records a spawn writes and the
# file-backed mailboxes a teammate's runner polls. The engine is what owns a
# teammate's lifetime, so it is the crate that names this — and it names it
# rather than reimplementing the documents, because a real `claude` process
# reads and writes the same directory.
ganja-team.workspace = true
# The builtin tools and the read log, re-exported as `ganja_core::tool` and
# `ganja_core::watch`. The dependency runs one way only: nothing in there may
# name this crate.
ganja-tool.workspace = true
# The `AGENTS.md` family is discovered by walking the worktree under the same
# ignore rules the tools search it with, so a file `glob` would skip is a file
# the instruction layer skips too.
ignore.workspace = true
# The prompt's UTC date is rendered through the workspace's one calendar
# vocabulary while remaining stable across the machine that runs a session.
jiff.workspace = true
# `config::legacy` alone, which is the one place the dialect this build has
# left is still decoded — for `ganja config migrate` to read what it converts.
# Only the `serde` feature is on: it makes the parser itself a
# `serde::Deserializer` over the token stream, so such a file decodes straight
# into the same typed struct and sees keys in document order. Going through a
# `serde_json::Value` instead would sort them, and the order permission rules
# were written in is what decides which one wins.
jsonc-parser = { workspace = true, features = ["serde"] }
# The config file's own format. Read through `toml::de`, whose deserializer
# walks the parsed document rather than a re-sorted map, so a config decodes
# straight into its typed struct and sees keys in document order — the same
# property the JSONC reader beside it was chosen for, and the same reason:
# permission rules are evaluated last-match-wins.
toml.workspace = true
# The LSP client's payloads are LSP's own types — diagnostics, positions,
# sync kinds — decoded straight off the wire rather than re-declared here
# and drifting from the protocol at the next revision of it.
lsp-types.workspace = true
# The HTTP providers speak SSE, so only `stream` and `json` are load-bearing;
# the workspace declaration pins rustls so no build here reaches for OpenSSL.
# A configured hook's `matcher`, compiled once at load and asked whether it
# matches one tool name, one compaction trigger or one session source. See the
# workspace declaration for why neither matcher already in the tree fits.
regex.workspace = true
reqwest.workspace = true
# Config-named MCP servers are spoken to through the official SDK rather than
# a second hand-rolled JSON-RPC client: the workspace declaration carries the
# stdio and streamable-HTTP transports this module connects over.
rmcp.workspace = true
# The one secret this crate's own code reads rather than only tests: an MCP
# server's stored OAuth access token, exposed once to build the `Authorization:
# Bearer` header `mcp.rs`'s dial sends. Every other credential stays inside
# `ganja-provider`'s wires.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
# The team file is a document a real `claude` shares the directory with, so it
# is replaced through a temporary and a rename rather than written in place.
# The crate is what ties that temporary's life to a value: it is removed
# however the write ends, including the rename failure a hand-named staging
# file has no owner to clean up after. `ganja-team`'s mailbox writes the same
# way, for the same reason and against the same reader.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
# `Host`, for deciding whether an endpoint is loopback without matching strings.
url.workspace = true
# `CancellationToken` lives behind `rt`; the workspace declaration carries no
# features so crates opt into exactly the modules they use.
tokio-util = { workspace = true, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
# The LSP and MCP servers this crate spawns are ended by signalling their
# process group, and `killpg` is that call; Windows support arrives with its own
# mechanism later.
libc.workspace = true

[dev-dependencies]
# `tests/teammate_engine_door.rs` alone, for the two tmux environment variable
# names it clears before asserting that an in-process door looks at no pane.
# **Dev-only, and deliberately**: `-e normal` is what the boundary gate reads,
# and this crate's shipped closure still names nothing above it — the same
# dev-cycle shape `ganja-testkit` below already has.
ganja-teammate-local.workspace = true
# The scripted-provider/recorder-tool/storage-seeding scaffolding
# `tests/*.rs` shares across binaries — see `crates/ganja-testkit`.
ganja-testkit.workspace = true
# `tests/{storage_preuuid,storage_preuuid_wal,storage_preuuid_inode,
# reasoning_downgrade}.rs` alone, for the raw `rusqlite::Connection` each opens
# to write a fixture database byte-for-byte the way an old build or a
# concurrent writer would, ahead of what `ganja-storage` reads back. **Dev-only
# and deliberately**, the same shape as `ganja-teammate-local` above: `-e
# normal` is what every boundary gate reads, so this line does not widen
# `ganja-core`'s shipped closure — `ganja-storage` remains the only member
# whose *normal* manifest names `rusqlite` (**D540**).
rusqlite.workspace = true
# Compiles `ganja-config.schema.json` and validates fixtures against it in
# `tests/config_schema.rs`. Nothing in the library itself reads a schema.
jsonschema.workspace = true
# Only for `tests/mentions.rs`'s image-attachment check: encodes a pixel
# fixture and decodes the request's base64 payload back, so the assertion is
# "a real PNG of the right dimensions reached the wire" rather than "some
# bytes did."
png.workspace = true
# `net` is for the provider tests only: they serve canned HTTP over a loopback
# socket rather than mocking the client, so the request really is built, sent,
# retried and streamed. The library itself needs no listener. `test-util` is
# for the LSP wait contract: its whole behavior is a freshness window and a
# 150ms debounce that restarts, and a test that drives the runtime's clock
# proves those in microseconds where one that slept would spend seconds and
# still be a race.
tokio = { workspace = true, features = ["net", "test-util"] }
# Only for tests that read a subscriber back: the secret-hygiene canary, and
# the receipt-vetting test whose observable is which refusal's trace line
# fired.
tracing-subscriber.workspace = true
