[package]
name = "ganja-cli"
description = "The `ganja` command-line binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io. Also load-bearing for deny.toml: with every
# member unpublished, `allow-wildcard-paths` exempts the workspace's own path
# dependencies from `wildcards = "deny"`.
publish = false

[[bin]]
name = "ganja"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The log directory is resolved here rather than asked of `ganja-core`, which
# exposes its own paths but not the data home they hang under. `auth.rs` and
# `project.rs` already each resolve it this way; this is the third.
etcetera.workspace = true
ganja-core.workspace = true
ganja-tui.workspace = true
# Only for the raw-mode read that keeps a typed API key off the screen, through
# the same crossterm instance the UI drives so the two cannot disagree about
# terminal state.
ratatui.workspace = true
# A typed or piped key is wrapped the moment it is whole, and the buffer it was
# assembled in is wiped rather than left in the heap.
secrecy.workspace = true
tokio.workspace = true
# The binary is where the log sink is chosen, because it is the only crate that
# knows whether a terminal is about to be taken over. The library crates trace;
# none of them decides where it lands.
tracing.workspace = true
# Rolling files, so a long-lived session cannot grow one without bound, and a
# worker thread, so a trace never blocks the render loop on a disk write.
tracing-appender.workspace = true
# `env-filter` is what makes `RUST_LOG` mean anything here.
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
# The pty tests write the fake provider's script and read the permission rules
# a session stored, both of which are JSON documents rather than text.
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
expectrl.workspace = true
