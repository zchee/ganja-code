[package]
name = "ganja-cli"
description = "The `ganja` command-line binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ganja"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ganja-core.workspace = true
ganja-tui.workspace = true
# Only for the raw-mode read that keeps a typed API key off the screen, through
# the same crossterm instance the UI drives so the two cannot disagree about
# terminal state.
ratatui.workspace = true
# A typed or piped key is wrapped the moment it is whole, and the buffer it was
# assembled in is wiped rather than left in the heap.
secrecy.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
expectrl.workspace = true
