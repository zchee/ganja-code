[package]
name = "tmux"
description = "Rust port of pandaemonium pkg/tmux: an async tmux control-mode client over a sans-io parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io — crates.io's own `tmux` name is squatted by
# an unrelated placeholder (see the port plan's ADR, which accepts the
# collision because publishing is deferred workspace-wide). Also
# load-bearing for deny.toml: with every member unpublished,
# `allow-wildcard-paths` exempts the workspace's own path dependencies from
# `wildcards = "deny"`.
publish = false

# Sealed leaf (P26 user directive, hard constraint, not deferred): no
# `ganja-*` crate may appear in this file, in either table, and no
# `ganja-*` crate may depend on this one. Both directions are CI-asserted —
# see the workspace root Cargo.toml's comment where member path
# dependencies are declared, and the boundary-gate job in
# `.github/workflows/ci.yaml`.
[dependencies]
# Typed, message-carrying errors across the rendering, decoding, and
# protocol surfaces — the same choice every other member of this workspace
# makes.
thiserror.workspace = true
# The async runtime both transports' subprocesses ride: the persistent
# `tmux -C` client (tokio::process, piped stdio, spawned read/stderr tasks)
# and the one-shot client each `Server::run` spawns. Declared from the
# port's first commit so this manifest — which the CI gate pins an exact
# external-dependency allowlist against — does not change shape as waves
# land.
tokio.workspace = true
# Stream adapters for the control-mode client's drop-oldest event queue.
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
