[package]
name = "ganja-tui"
description = "ratatui frontend for ganja."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io. Also load-bearing for deny.toml: with every
# member unpublished, `allow-wildcard-paths` exempts the workspace's own path
# dependencies from `wildcards = "deny"`.
publish = false

[dependencies]
anyhow.workspace = true
# `/copy`, `/copy-message` and the `ctrl+v` paste fallback reach the system
# clipboard through it. Only ever constructed behind the seam in
# `src/clipboard.rs`, so nothing in a test run talks to a real desktop.
arboard.workspace = true
# Two escape sequences carry a base64 payload — the OSC 52 clipboard write and
# the kitty graphics transmission — and both fed a scalar encoder `clipboard.rs`
# carried itself. One vectorised codec, already in the tree under the provider
# crate's logins, serves both.
base64.workspace = true
# Not named in the source: it exists to enable crossterm's `event-stream`
# feature on the crate instance `ratatui` re-exports.
crossterm.workspace = true
# Themes are discovered under the XDG config directory and the runtime pick is
# stored under the XDG data directory; the same resolver the engine's stores
# use, so both halves of the app agree on where a user's files live.
etcetera.workspace = true
futures.workspace = true
ganja-core.workspace = true
# The frontend loads the project's stored permission rules and hands them to
# the engine. Named directly rather than through `ganja-core`'s root, which is
# what keeps "the frontend needs the protocol and nothing else about the engine
# to render" honest.
ganja-permission.workspace = true
# The types this crate turns into frames, named directly rather than through
# `ganja-core`'s re-export: a frontend needs the protocol and nothing else about
# the engine to render a transcript, and depending on it that way is what keeps
# that true.
ganja-protocol.workspace = true
# The machine-bound teammate backends this frontend assembles (**D539**): a
# pane needs a tmux server and the shell to split into, which is a property of
# the terminal this crate owns and not of the engine it drives. Named here
# rather than reached through `ganja-core`, which may not name a crate above
# it.
ganja-teammate-local.workspace = true
# The `@` file menu runs the glob tool in-process, which is why the frontend
# links the tool crate rather than asking the engine to walk the tree for it: it
# preserves today's documented behavior at no latency cost. Rerouting the menu
# through an engine API is the work of the phase that grows a remote frontend,
# which cannot link this crate at all.
ganja-tool.workspace = true
# Copied transcripts render their persisted millisecond clocks in UTC through
# the same date vocabulary as the other crates, without reaching into core.
jiff.workspace = true
# The palette and the `/` dropdown rank commands by a typed fragment. The same
# matcher helix and nucleo use, so a fragment scores here the way it scores in
# every other terminal picker the user already knows.
nucleo-matcher.workspace = true
# Encodes a clipboard-pasted image (`clipboard.rs::Clipboard::read_image`) to
# PNG bytes before it enters the mention pipeline as an `@`-attached file.
image.workspace = true
png.workspace = true
# An assistant's reply is markdown. Parsed into block events rather than into
# HTML — the transcript needs headings, fences and table cells as data it can
# style, and there is no browser at the other end.
pulldown-cmark.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
# Theme files decode into typed structures rather than being walked as raw
# values, so a missing `theme` block is a decode error naming the file.
serde.workspace = true
serde_json.workspace = true
# Fenced code inside a reply. Only the parser and the bundled syntax set are
# used: syntect's own themes are ignored, because the nine `syntax*` keys the
# active ganja theme already carries are what has to paint the tokens.
syntect.workspace = true
# `/editor` hands the buffer to `$EDITOR` through a file, and that file has to
# be somewhere the editor can open and nothing else will collide with.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The `@` file menu drives the glob tool, whose `ToolCtx` carries the
# cancellation token a turn would have handed it.
tokio-util.workspace = true
# A custom theme that will not load is skipped rather than fatal, which is only
# defensible if the run says which file it dropped and why.
tracing.workspace = true
# The transcript measures its own wrap widths, so it also chooses its own split
# points — and a split point is a grapheme-cluster boundary, never a `char`
# one: walking by `char` put hard wraps inside ZWJ emoji and combining
# sequences, which no terminal can redraw as the glyph the text meant.
unicode-segmentation.workspace = true
unicode-width.workspace = true
# A dropped `file://` path decodes through `Url::to_file_path`, which already
# carries the percent-decoding and the localhost-host rule upstream's own
# `fileURLToPath` applies (`mention.rs`'s classifier) — reusing it here is the
# alternative to reimplementing URL parsing badly.
url.workspace = true

[dev-dependencies]
# The submit-time degradation warning needs a provider whose wire refuses
# binary attachments, and the scripted recorder's `text_only` double is that
# provider — the fake accepts everything by design.
ganja-testkit.workspace = true
insta.workspace = true
