[package]
name = "ganja-tui"
description = "ratatui frontend for ganja."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# Not named in the source: it exists to enable crossterm's `event-stream`
# feature on the crate instance `ratatui` re-exports.
crossterm.workspace = true
futures.workspace = true
ganja-core.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
serde_json.workspace = true
tokio.workspace = true
unicode-width.workspace = true

[dev-dependencies]
insta.workspace = true
# The resume tests drive a real session store, because what they pin is that a
# resume either finds the session it was asked for or fails loudly — which a
# stubbed store could only assert about itself.
tempfile.workspace = true
