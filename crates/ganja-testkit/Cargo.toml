[package]
name = "ganja-testkit"
description = "Shared scaffolding for ganja-core's integration suites: scripted providers, recorder tools, and the storage/session builders `tests/*.rs` otherwise reimplements per file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Dev-only: nothing outside a crate's `[dev-dependencies]` should ever depend
# on this one. Also load-bearing for deny.toml the way every other member's
# `publish = false` is: `allow-wildcard-paths` exempts the workspace's own
# path dependencies from `wildcards = "deny"`.
publish = false

[dependencies]
# `Provider` and `Tool` are dyn-safe async traits; every scripted double here
# implements one or the other, for the same reason ganja-core itself does.
async-trait.workspace = true
futures.workspace = true
ganja-core.workspace = true
# The wire types the doubles speak — `Message`, `Event`, `Usage` — come from
# their home crate, not through `ganja-core`'s root, which names only the
# engine's own types.
ganja-protocol.workspace = true
# The cursor mock server encodes and decodes the wire's own protobuf: the
# messages come through `ganja_core::provider::cursor::proto`, but `encode_to_vec`
# and `decode_from_slice` are `buffa::Message`'s, so the trait has to be nameable
# here. Codegen-only, exactly as `ganja-provider` names it.
buffa.workspace = true
# The five external backends `externals()` assembles are that crate's, so a
# fixture lead is production on a machine where none of the foreign CLIs is
# installed rather than a stub of one. A normal dependency, not a dev one: the
# fixtures are this crate's public surface.
ganja-teammate-local.workspace = true
# Same rule for the `Tool` trait and the task seam the doubles implement: the
# tool crate is where they live, so it is the crate this one names.
ganja-tool.workspace = true
# `RecorderTool`/`BlockingTool` advertise a schema the same way a real tool
# does — the loop never validates a call's arguments against it, but the
# registry still has to have one to offer.
schemars.workspace = true
# The fake `claude` CLI's script and its side file are both JSON documents a
# test writes and reads, so the double derives them rather than hand-parsing.
serde.workspace = true
serde_json.workspace = true
# One temporary directory per test, for the storage- and XDG-redirect
# builders — deleted with the handle, never the real user's state.
tempfile.workspace = true
# `io-std` and `signal` are the fake `claude` CLI's: re-exec'd as a child it
# speaks over the real stdin and stdout, and it records a signal rather than
# dying of one, so a test can tell "no signal was sent" from "one was sent and
# worked".
tokio = { workspace = true, features = ["io-std", "signal"] }
# `CancellationToken` lives behind `rt`, the same feature ganja-core itself
# enables it with.
tokio-util = { workspace = true, features = ["rt"] }
# `LogCapture` is a `MakeWriter`: the trait every suite that reads its own
# log back needs implemented once rather than eight times.
tracing-subscriber.workspace = true
