# Deliberately absent: `-C target-cpu=native`. A release artifact must run on
# every machine of its architecture, and cargo offers no shape that scopes the
# flag to non-release profiles on one target: profile rustflags land *before*
# the target's (codegen flags are last-wins, so the target block always won),
# and putting native on the dev profile applies to every platform — a GitHub
# ubuntu runner SIGILLed its own freshly built build-scripts under exactly
# that (CPUID inside those VMs misreports what the host executes). Interactive
# builds on this machine are governed by the ambient RUSTFLAGS anyway, which
# replaces this whole block when set; gates and CI run with it unset.
[target.aarch64-apple-darwin]
rustflags = [
  "-C",
  "force-frame-pointers=on",
  "-Z",
  "mir-opt-level=4",
  "-Z",
  "inline-mir=yes",
  "-C",
  "llvm-args=-unroll-threshold=500",
  "-C",
  "llvm-args=-enable-dfa-jump-thread",
  "-C",
  "link-arg=-Wl,-dead_strip",
]
