name: Handoff reset trace

on:
  push:
    branches:
      - investigate/handoff-reset-trace

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: preflight before setup and compilation
        run: bash scripts/handoff-reset-trace/preflight.sh
      - name: install the repository toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-analyzer && rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: install the CI suite terminal dependency
        run: |
          command -v /home/linuxbrew/.linuxbrew/bin/brew
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install tmux
          printf '%s/bin\n' "$(brew --prefix)" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: v1.18.22
          path: upstream/opencode-v1.18.22
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: upstream/opencode-v1.18.22/node_modules
          key: opencode-v1.18.22-${{ runner.os }}-${{ hashFiles('upstream/opencode-v1.18.22/bun.lock') }}
      - name: install the upstream CI fixture
        working-directory: upstream/opencode-v1.18.22
        run: bun install --frozen-lockfile
      - name: preflight installed suite commands before compilation
        run: command -v bun && command -v tmux && command -v cargo-nextest && command -v rust-analyzer
      - name: build only the unchanged CI workspace
        run: bash scripts/handoff-reset-trace/build.sh
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.22
          GANJA_LSP_EDIT_BUDGET_MS: "6000"
      - name: measure worker-test neighbourhood then the exact CI suite
        run: bash scripts/handoff-reset-trace/loaded.sh
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.22
          GANJA_LSP_EDIT_BUDGET_MS: "6000"
      - name: preserve measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: handoff-reset-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/handoff-reset-results
          if-no-files-found: error
          retention-days: 14
