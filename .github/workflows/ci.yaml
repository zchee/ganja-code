name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # @master is the invocation form that takes an explicit toolchain; the
      # date matches rust-toolchain.toml, which this action does not read.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-07
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # Doc links are the one thing in these files nothing else checks. A
      # `[`Thing`]` whose target was renamed, made private or moved still reads
      # correctly in the source and still compiles — it just renders as literal
      # brackets, so the rot is invisible to every gate above and to the person
      # writing the next paragraph. This workspace leans on intra-doc links
      # unusually hard (module docs cite the seam they describe), which is
      # exactly why it had accumulated 136 broken ones by P22 with everything
      # else green. `--no-deps` holds it to this workspace's own crates;
      # `rustdoc` itself ships with the `rustc` component, so no new toolchain
      # component is needed above.
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: ganja-core stays free of terminal dependencies
        run: '! cargo tree -p ganja-core -e normal | grep -q ratatui'

      - name: ganja-core stays free of the http server
        run: '! cargo tree -p ganja-core -e normal | grep -q axum'

      # Allowlist form, not a blocklist grep: a `! grep -q ganja-core` names
      # one crate and silently weakens the day a new internal crate appears —
      # a tool → ganja-provider edge would pass it while inverting the same
      # layering. Asserting the exact internal set fails closed instead: a new
      # edge fails until this line is edited deliberately.
      - name: ganja-tool's internal dependencies are exactly the permission crate
        run: |
          internal="$(cargo tree -p ganja-tool -e normal --prefix none | awk '{print $1}' | grep '^ganja-' | grep -v '^ganja-tool$' | sort -u | tr '\n' ' ')"
          test "$internal" = "ganja-permission "

      # The same closed form for the engine: its internal deps are exactly the
      # four crates beneath it, in sorted order. A split crate joining this
      # list is a deliberate edit here, never an accident the old greps missed.
      - name: ganja-core's internal dependencies are exactly the four beneath it
        run: |
          internal="$(cargo tree -p ganja-core -e normal --prefix none | awk '{print $1}' | grep '^ganja-' | grep -v '^ganja-core$' | sort -u | tr '\n' ' ')"
          test "$internal" = "ganja-permission ganja-protocol ganja-provider ganja-tool "

      # The teams directory is file I/O over a document format ganja does not
      # own, so the list that matters is the one it must never grow: the
      # engine (its answers would end up underneath it), the permission crate
      # (a mailbox decides nothing), the tools. It reads the protocol for the
      # frames a message body carries and the id a write is stamped with, and
      # that is all — asserted closed from the crate's first commit, before
      # there is a convenient edge to add.
      - name: ganja-team's internal dependencies are exactly the protocol
        run: |
          internal="$(cargo tree -p ganja-team -e normal --prefix none | awk '{print $1}' | grep '^ganja-' | grep -v '^ganja-team$' | sort -u | tr '\n' ' ')"
          test "$internal" = "ganja-protocol "

      # And for the wires. `ganja-permission` is here transitively, through
      # `ganja-tool`: a request offers the model `ToolDefinition`s, which is the
      # only thing this crate wants of the tools. What the allowlist forbids is
      # the edge back — a wire that named the engine would put a vendor's HTTP
      # inside the loop it is supposed to be driven by.
      - name: ganja-provider's internal dependencies are exactly the three beneath it
        run: |
          internal="$(cargo tree -p ganja-provider -e normal --prefix none | awk '{print $1}' | grep '^ganja-' | grep -v '^ganja-provider$' | sort -u | tr '\n' ' ')"
          test "$internal" = "ganja-permission ganja-protocol ganja-tool "

      # A wire renders nothing and copies nothing. The engine is held to the
      # terminal rule one level up; asserting it here as well is what keeps a
      # future login flow from reaching for a TUI prompt or the clipboard
      # instead of handing the question back to whoever asked.
      - name: ganja-provider stays free of terminal and clipboard dependencies
        run: |
          ! cargo tree -p ganja-provider -e normal | grep -q ratatui
          ! cargo tree -p ganja-provider -e normal | grep -q crossterm
          ! cargo tree -p ganja-provider -e normal | grep -q arboard

      # A prost/tonic fence stood here — `! grep -qE 'prost|tonic'` on the
      # engine and the wires — while the cursor wire was a stub, to force a
      # gRPC stack into a crate of its own the day it landed. It was removed
      # when the real wire landed, under a ruling that dependency weight is not
      # this project's constraint: a dependency is admitted when its license is
      # valid (asserted by `cargo deny` below) and the workspace compiles. The
      # cursor wire's messages ride `buffa` (pure-Rust protobuf) in the
      # provider crate, and its transport rides the provider crate too; what
      # keeps a vendor's HTTP *server* out of the engine is the layering
      # allowlists below — direction, not weight.

      # tail strips the crate's own header line, which would match the grep.
      - name: the bottom crates stay leaves
        run: |
          ! cargo tree -p ganja-permission -e normal | tail -n +2 | grep -q ganja-
          ! cargo tree -p ganja-protocol -e normal | tail -n +2 | grep -q ganja-

      # The leaf gate above only sees ganja-* crates, so it cannot notice the
      # protocol quietly widening its external list — measured: a scratch
      # `schemars.workspace = true` resolved cleanly, dragged six transitive
      # crates into what was then a two-dependency leaf, and left that gate
      # green. The manifest comment forbids widening; this makes the comment a
      # gate. `uuid` joined deliberately in P25 (D493, the id mint) and is
      # depth-1 only — its own `getrandom` is below this gate's horizon.
      - name: ganja-protocol's direct dependencies are exactly serde, serde_json and uuid
        run: |
          external="$(cargo tree -p ganja-protocol -e normal --depth 1 --prefix none | tail -n +2 | awk '{print $1}' | sort -u | tr '\n' ' ')"
          test "$external" = "serde serde_json uuid "

      # The client's whole reason to exist is what it does *not* link: an
      # engine (it would become a second frontend rather than a consumer of
      # the served one) or the server (it would drag axum into every build
      # that only wanted to talk to one). Allowlist form from birth, so a
      # ganja-serve creep — which a `∌ ganja-core` grep could not see — fails
      # closed too.
      - name: ganja-client's internal dependencies are exactly the protocol
        run: |
          internal="$(cargo tree -p ganja-client -e normal --prefix none | awk '{print $1}' | grep '^ganja-' | grep -v '^ganja-client$' | sort -u | tr '\n' ' ')"
          test "$internal" = "ganja-protocol "

      # The frontends' own lanes, previously true but unasserted: the
      # terminal frontend never grows the HTTP server, the HTTP frontend
      # never grows the terminal, and the client grows neither.
      - name: the frontends stay in their lanes
        run: |
          ! cargo tree -p ganja-tui -e normal | grep -q axum
          ! cargo tree -p ganja-serve -e normal | grep -q ratatui
          ! cargo tree -p ganja-client -e normal | grep -q axum

      # The workspace rule "every dependency version lives in the root
      # manifest" was convention only; this makes it a gate. A member manifest
      # naming a version inside any dependencies section fails, printed with
      # its file and line. awk exits with bad=1 exactly when a match printed,
      # so the step needs no inversion.
      - name: every dependency version lives in the root manifest
        run: |
          awk 'FNR==1{sec=""} /^\[/{sec=$0} sec ~ /dependencies/ && /version[[:space:]]*=/ {print FILENAME ":" FNR ": " $0; bad=1} END{exit bad}' crates/*/Cargo.toml

  deny:
    name: deny
    # Advisories, licenses, bans and source-registry checks are static
    # analysis over Cargo.lock metadata, not compiled code, so the result
    # cannot differ between the test job's ubuntu and xcode runners; running
    # it once here instead of across that matrix isn't a coverage gap.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # cargo-deny-action ships its own cargo-deny binary rather than
      # building one, but cargo-deny still shells out to `cargo metadata` to
      # read the dependency graph, so a `cargo` on PATH is required. Installed
      # explicitly, like every other job here, rather than assumed present on
      # the runner image.
      - uses: dtolnay/rust-toolchain@master
        with:
          # The same date rust-toolchain.toml pins; this action does not read
          # that file, so the date is repeated here on purpose.
          toolchain: nightly-2026-08-07

      - name: dependency audit (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          # A windows-2025 entry stood here (and a windows-lint job above)
          # until 2026-08-12: windows support is parked for now, and the
          # lanes left with it. The cfg(windows) code still in the tree has
          # no compile signal while this holds; a revival is a deliberate
          # decision that starts observational again, not a paused lane
          # flipping back.
    runs-on: ${{ matrix.os }}
    # Naming bash adds pipefail to every run step, which the runners'
    # implicit `bash -e` default does not.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          # The same date rust-toolchain.toml pins — this action does not read
          # that file. The LSP diagnostics drill spawns rust-analyzer from
          # PATH; the component ships it with the pinned toolchain on every
          # runner.
          toolchain: nightly-2026-08-07
          components: rust-analyzer

      - uses: Swatinem/rust-cache@v2

      # The suite runs under nextest, which gives each test its own process —
      # the tests that mutate process-wide environment are isolated by that
      # rather than by staying off one thread. Installed from a prebuilt
      # binary rather than compiled.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The golden differential test drives the real upstream opencode at its
      # pinned tag, headless under bun, and hard-fails when the checkout is
      # missing rather than silently comparing against nothing — so CI has to
      # provide both. The checkout lands in upstream/, which exists only on
      # the runner: .omc/ is local tooling state and never committed, so the
      # workflow cannot assume it and should not create it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: check out the upstream behavioral spec
        uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: v1.18.13
          path: upstream/opencode-v1.18.13
          persist-credentials: false

      - name: cache the upstream dependency install
        uses: actions/cache@v6
        with:
          path: upstream/opencode-v1.18.13/node_modules
          key: opencode-v1.18.13-${{ runner.os }}-${{ hashFiles('upstream/opencode-v1.18.13/bun.lock') }}

      - name: install the upstream dependencies
        working-directory: upstream/opencode-v1.18.13
        run: bun install --frozen-lockfile

      - name: test
        run: cargo nextest run --workspace --profile ci
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.13
          # A shared runner under load adds whole seconds of queueing to the
          # lsp drill's timed edit, so CI holds the drill just past the
          # client's own 5s ceiling; the tighter 3s default stays what a
          # development machine is held to. At 5s the client itself stops
          # waiting and the drill fails on the missing diagnostics block, so
          # this cannot mask a wedge — the margin above the ceiling covers
          # only the drill's own bookkeeping around the call, which its clock
          # includes and the client's does not (a budget equal to the ceiling
          # lost to exactly that, 5002ms with the complaint attached).
          GANJA_LSP_EDIT_BUDGET_MS: "6000"

      # nextest does not run doctests, so they get their own step; the
      # testkit's builder examples are what it runs today.
      - name: doc-tests
        run: cargo test --workspace --doc
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.13
