name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NOTE(zchee): avoid 'trust aws/tap' warning
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test/${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          # A windows-2025 entry stood here (and a windows-lint job above)
          # until 2026-08-12: windows support is parked for now, and the
          # lanes left with it. The cfg(windows) code still in the tree has
          # no compile signal while this holds; a revival is a deliberate
          # decision that starts observational again, not a paused lane
          # flipping back.

    # Naming bash adds pipefail to every run step, which the runners'
    # implicit `bash -e` default does not.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          # The same channel rust-toolchain.toml pins — this action does not
          # read that file. The LSP diagnostics drill spawns rust-analyzer
          # from PATH; the component ships it with the installed toolchain on
          # every runner.
          toolchain: nightly
          components: rust-analyzer

      - uses: Swatinem/rust-cache@v2

      # The suite runs under nextest, which gives each test its own process —
      # the tests that mutate process-wide environment are isolated by that
      # rather than by staying off one thread. Installed from a prebuilt
      # binary rather than compiled.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The pane suites (ganja-core's teammate_pane_*, ganja-cli's
      # teammate_* and pane_lead consumers) and the tmux crate's own
      # hard-fail live suite drive a real tmux server, so CI has to provide
      # one — the same posture as the golden differential's bun below. Both
      # lanes pour homebrew's bottle rather than trusting the image: the
      # ubuntu image's apt tmux predates commands the register types
      # (new-pane), and the xcode image ships none at all, so this is the
      # one way both lanes measure the same tmux without compiling one.
      # Linuxbrew is preinstalled but off PATH (the image README's own
      # note); GITHUB_PATH prepends, so the poured tmux outranks the
      # image's /usr/bin/tmux in every later step.
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          brew install tmux
          tmux -V

      # The golden differential test drives the real upstream opencode at its
      # pinned tag, headless under bun, and hard-fails when the checkout is
      # missing rather than silently comparing against nothing — so CI has to
      # provide both. The checkout lands in upstream/, which exists only on
      # the runner: .omc/ is local tooling state and never committed, so the
      # workflow cannot assume it and should not create it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: check out the upstream behavioral spec
        uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: v1.18.22
          path: upstream/opencode-v1.18.22
          persist-credentials: false

      - name: cache the upstream dependency install
        uses: actions/cache@v6
        with:
          path: upstream/opencode-v1.18.22/node_modules
          key: opencode-v1.18.22-${{ runner.os }}-${{ hashFiles('upstream/opencode-v1.18.22/bun.lock') }}

      - name: install the upstream dependencies
        working-directory: upstream/opencode-v1.18.22
        run: bun install --frozen-lockfile

      # `--locked` so a manifest/lock mismatch — a Renovate branch whose
      # artifact step half-failed, PR #12's shape — fails here by name instead
      # of cargo silently rewriting the lock on the runner and testing a
      # resolution the branch does not carry.
      - name: test
        run: cargo nextest run --locked --workspace --profile ci
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.22
          # A shared runner under load adds whole seconds of queueing to the
          # lsp drill's timed edit, so CI holds the drill just past the
          # client's own 5s ceiling; the tighter 3s default stays what a
          # development machine is held to. At 5s the client itself stops
          # waiting and the drill fails on the missing diagnostics block, so
          # this cannot mask a wedge — the margin above the ceiling covers
          # only the drill's own bookkeeping around the call, which its clock
          # includes and the client's does not (a budget equal to the ceiling
          # lost to exactly that, 5002ms with the complaint attached).
          GANJA_LSP_EDIT_BUDGET_MS: "6000"

      # nextest does not run doctests, so they get their own step; the
      # testkit's builder examples are what it runs today.
      - name: doc-tests
        run: cargo test --workspace --doc
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.22

  lint:
    name: lint
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      # @master is the invocation form that takes an explicit toolchain; the
      # channel matches rust-toolchain.toml, which this action does not read.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      # `--locked` for the same reason the test job carries it: a stale
      # Cargo.lock is a finding, not something to quietly repair.
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Doc links are the one thing in these files nothing else checks. A
      # `[`Thing`]` whose target was renamed, made private or moved still reads
      # correctly in the source and still compiles — it just renders as literal
      # brackets, so the rot is invisible to every gate above and to the person
      # writing the next paragraph. This workspace leans on intra-doc links
      # unusually hard (module docs cite the seam they describe), which is
      # exactly why it had accumulated 136 broken ones by P22 with everything
      # else green. `--no-deps` holds it to this workspace's own crates;
      # `rustdoc` itself ships with the `rustc` component, so no new toolchain
      # component is needed above.
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The seventeen shell steps that stood here, carrying nineteen
      # assertions — nine inverted `cargo tree | grep` ban lines, seven exact
      # internal-dependency sets, three leaf assertions, two exact
      # direct-dependency sets, one reverse "nothing else depends on tmux"
      # loop over `cargo metadata --no-deps | jq`, and one awk over the member
      # manifests — are now one reviewable policy file, `depgate.toml`, and
      # one run of the gate that reads it. Every assertion those lines made is
      # still made; `ganja-cli` and `ganja-testkit` carry no rule because
      # those lines never named them. Each rule's rationale and the retired
      # step it replaces are comments in `depgate.toml` itself — read them
      # before editing it.
      #
      # cargo-depgate never compiles this workspace: evaluating the whole
      # policy costs one `cargo metadata` resolve, in place of the thirty-odd
      # `cargo tree` invocations those steps paid for (the sealed-leaf loop
      # alone ran one per member). Building the gate itself is a separate cost
      # and is not paid per run: `cargo install` compiles cargo-depgate and
      # its dependency tree from source, which is minutes, so the binary is
      # restored from the cache and installed only on a miss. The `--rev`
      # names the v0.1.1 tag, backed by that repo's published GitHub Release
      # of the same name (it resolves to c1fae0969e02 today): a release makes
      # a moved tag a visible event rather than a silent swap, which is what
      # made the earlier bare-sha pin unnecessary. The same tag is in the
      # cache key, so bumping it installs once and restores thereafter.
      # rust-cache above also keeps `~/.cargo/bin` (its
      # cache-bin default), but its key churns with the lockfile; this
      # dedicated entry is a deliberate duplicate that survives that churn,
      # and the restore order keeps it authoritative (rust-cache restores
      # first, this cache overwrites). The install's `--locked` is `cargo
      # install`'s: build the tool against the Cargo.lock it ships at that
      # rev. `cargo depgate` itself passes `--locked` to its own
      # `cargo metadata` by default, for the same reason clippy carries it,
      # and the report auto-selects GitHub annotations under Actions.
      - name: cache the dependency gate
        id: depgate-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-depgate
          key: cargo-depgate-${{ runner.os }}-${{ runner.arch }}-v0.1.1

      - name: install the dependency gate
        if: steps.depgate-cache.outputs.cache-hit != 'true'
        # The trailing package name is required: the repo's test fixtures
        # carry other binary packages, and `cargo install --git` refuses to
        # guess among them.
        run: cargo install --git https://github.com/zchee/cargo-depgate --rev v0.1.1 --locked cargo-depgate

      - name: dependency policy
        run: cargo depgate check --config depgate.toml

  # Advisories, licenses, bans and source-registry checks are static
  # analysis over Cargo.lock metadata, not compiled code, so the result
  # cannot differ between the test job's ubuntu and xcode runners; running
  # it once here instead of across that matrix isn't a coverage gap.
  deny:
    name: deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # cargo-deny-action ships its own cargo-deny binary rather than
      # building one, but cargo-deny still shells out to `cargo metadata` to
      # read the dependency graph, so a `cargo` on PATH is required. Installed
      # explicitly, like every other job here, rather than assumed present on
      # the runner image.
      - uses: dtolnay/rust-toolchain@master
        with:
          # The same channel rust-toolchain.toml pins; this action does not
          # read that file, so the channel is repeated here on purpose.
          toolchain: nightly

      - name: dependency audit (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
