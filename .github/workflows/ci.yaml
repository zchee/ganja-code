name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: ganja-core stays free of terminal dependencies
        run: '! cargo tree -p ganja-core -e normal | grep -q ratatui'

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-26.04
          - xcode-27
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      # The golden differential test drives the real upstream opencode at its
      # pinned tag, headless under bun, and hard-fails when the checkout is
      # missing rather than silently comparing against nothing — so CI has to
      # provide both. The checkout lands inside gitignored .omc/, same place
      # local runs keep it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: check out the upstream behavioral spec
        uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: v1.18.11
          path: .omc/reference/opencode-v1.18.11

      - name: cache the upstream dependency install
        uses: actions/cache@v4
        with:
          path: .omc/reference/opencode-v1.18.11/node_modules
          key: opencode-v1.18.11-${{ runner.os }}-${{ hashFiles('.omc/reference/opencode-v1.18.11/bun.lock') }}

      - name: install the upstream dependencies
        working-directory: .omc/reference/opencode-v1.18.11
        run: bun install

      - name: test
        run: cargo test --workspace
