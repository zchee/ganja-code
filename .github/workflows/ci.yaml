name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: ganja-core stays free of terminal dependencies
        run: '! cargo tree -p ganja-core -e normal | grep -q ratatui'

  deny:
    name: deny
    # Advisories, licenses, bans and source-registry checks are static
    # analysis over Cargo.lock metadata, not compiled code, so the result
    # cannot differ between the test job's ubuntu and xcode runners; running
    # it once here instead of across that matrix isn't a coverage gap.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # cargo-deny-action ships its own cargo-deny binary rather than
      # building one, but cargo-deny still shells out to `cargo metadata` to
      # read the dependency graph, so a `cargo` on PATH is required. Installed
      # explicitly, like every other job here, rather than assumed present on
      # the runner image.
      - uses: dtolnay/rust-toolchain@nightly

      - name: dependency audit (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-26.04
          - xcode-27
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # The LSP diagnostics drill spawns rust-analyzer from PATH; the
          # component ships it with the pinned toolchain on both runners.
          components: rust-analyzer

      - uses: Swatinem/rust-cache@v2

      # The suite runs under nextest, which gives each test its own process —
      # the tests that mutate process-wide environment are isolated by that
      # rather than by staying off one thread. Installed from a prebuilt
      # binary rather than compiled.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The golden differential test drives the real upstream opencode at its
      # pinned tag, headless under bun, and hard-fails when the checkout is
      # missing rather than silently comparing against nothing — so CI has to
      # provide both. The checkout lands in upstream/, which exists only on
      # the runner: .omc/ is local tooling state and never committed, so the
      # workflow cannot assume it and should not create it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: check out the upstream behavioral spec
        uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: v1.18.11
          path: upstream/opencode-v1.18.11
          persist-credentials: false

      - name: cache the upstream dependency install
        uses: actions/cache@v6
        with:
          path: upstream/opencode-v1.18.11/node_modules
          key: opencode-v1.18.11-${{ runner.os }}-${{ hashFiles('upstream/opencode-v1.18.11/bun.lock') }}

      - name: install the upstream dependencies
        working-directory: upstream/opencode-v1.18.11
        run: bun install --frozen-lockfile

      - name: test
        run: cargo nextest run --workspace --profile ci
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.11

      # nextest does not run doctests, so they get their own step. There are
      # none today, which makes this near-instant — but it means the first one
      # added later is run rather than silently skipped.
      - name: doc-tests
        run: cargo test --workspace --doc
        env:
          GANJA_OPENCODE_DIR: ${{ github.workspace }}/upstream/opencode-v1.18.11
